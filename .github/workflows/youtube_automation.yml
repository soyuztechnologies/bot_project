name: YouTube Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *' # every night at 02:00 AM IST

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install System Browsers
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y google-chrome-stable

      - name: Install SeleniumBase drivers
        run: |
          sbase install chromedriver

      - name: Configure Browser
        run: |
          python -c "import json; f=open('config.json','r'); d=json.load(f); f.close(); d['browser']['name']='chrome'; d['browser']['distribution']={'chrome':100}; f=open('config.json','w'); json.dump(d,f); f.close()"

      - name: Install NordVPN (batch IP rotation)
        # No 'if:' guard here: some runners reject secrets.* in step-if
        # expressions. Missing secret is handled inside bash instead —
        # bot then runs on direct IP.
        env:
          NORDVPN_TOKEN: ${{ secrets.NORDVPN_TOKEN }}
        run: |
          if [ -z "$NORDVPN_TOKEN" ]; then
            echo "NORDVPN_TOKEN not set - continuing on direct IP."
            exit 0
          fi
          sh <(curl -sSf https://downloads.nordcdn.com/apps/linux/install.sh)
          sudo nordvpn login --token "$NORDVPN_TOKEN"

      - name: Run YouTube Automation
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MONGO_URI_ATLAS: ${{ secrets.MONGO_URI_ATLAS }}
        run: python youtube_main.py

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-report
          path: logs/
          retention-days: 30
