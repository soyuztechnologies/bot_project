name: 24-Hour Summary Report

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Lookback window in hours'
        required: false
        default: '24'
      recipient:
        description: 'Override recipient email (optional)'
        required: false
        default: 'anubhav.abap@gmail.com'
  schedule:
    # 06:00 AM IST everyday = 00:30 UTC
    - cron: '30 0 * * *'

jobs:
  send-summary-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 24-Hour Summary Report
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MONGO_URI_ATLAS: ${{ secrets.MONGO_URI_ATLAS }}
          USER_NAME: ${{ github.event_name == 'schedule' && 'GitHub Actions (Scheduled)' || github.actor }}
          HOURS_INPUT: ${{ github.event.inputs.hours || '24' }}
          RECIPIENT_INPUT: ${{ github.event.inputs.recipient || 'anubhav.abap@gmail.com' }}
        run: |
          TARGET_TO="${RECIPIENT_INPUT:-anubhav.abap@gmail.com}"
          CMD="python send_summary_report.py --hours ${HOURS_INPUT:-24} --to $TARGET_TO"
          echo "Executing: $CMD"
          $CMD

      - name: Upload Summary Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-summary-excel-report
          path: logs/*.xlsx
          if-no-files-found: ignore
          retention-days: 30

