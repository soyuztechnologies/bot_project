name: Backlink Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *' # every night at 03:00 AM IST

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install SeleniumBase browsers
        run: |
          sbase install chromedriver
          sbase install edgedriver
          sbase install geckodriver

      - name: Run Backlink Automation
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MONGO_URI_ATLAS: ${{ secrets.MONGO_URI_ATLAS }}
        run: python backlink_main.py

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backlink-report
          path: logs/
          retention-days: 30
