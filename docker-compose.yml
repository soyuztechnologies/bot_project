# docker-compose.yml — Rankora
#
# Services:
#   bot        Interactive launcher (website / youtube / backlinks).
#              Started automatically by the dashboard UI.
#   dashboard  Flask dashboard on http://localhost:${RANKORA_PORT:-5050}
#              (Rankora-Setup.exe sets RANKORA_NAME / RANKORA_PORT per install)
#              Start with:  LAUNCH.bat  (double-click)
#              Or manually: docker compose up -d dashboard
#
# Data persistence:
#   config.json  — bot settings changed from dashboard are saved back to host
#   data/        — keywords, backlink sites, targets (editable on host)
#   logs/        — run logs written by automation scripts
#
# Secrets come from .env (created by SETUP.bat on first run).

services:
  bot:
    build: .
    image: ${RANKORA_NAME:-rankora}:latest
    container_name: ${RANKORA_NAME:-rankora}-bot
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["launcher.py"]

  dashboard:
    build: .
    image: ${RANKORA_NAME:-rankora}:latest
    container_name: ${RANKORA_NAME:-rankora}-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=5050
    ports:
      - "${RANKORA_PORT:-5050}:5050"
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["dashboard/app.py"]
