services:

  seo-bot:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: seo-youtube-bot

    stdin_open: true
    tty: true

    shm_size: "2gb"

    volumes:
      - ./profiles:/app/profiles
      - ./logs:/app/logs

    environment:
      DISPLAY: ":99"

    restart: "no"